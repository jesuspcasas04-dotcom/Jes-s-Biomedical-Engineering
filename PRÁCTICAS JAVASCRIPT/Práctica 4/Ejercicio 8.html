<!DOCTYPE html>
<head>
    <meta charset="UTF-8"/>
    <title>Ejercicio 8 Infraestructura de sistemas clínicos. Jesús Patiño Casas</title>
</head>
<body>
    <script>
        /*
          Ejercicio 8.
          Crear un programa que pida al usuario que introduzca por pantalla mediante un cuadro de diálogo la nota
          obtenida en las 6 prácticas de la asignatura de Infraestructuras de Sistemas Clínicos. Las notas se
          almacenarán en un vector y se mostrará por pantalla la media de la calificación obtenida
          cuantitativamente y cualitativamente (Sobresaliente >=9, Notable >=7, Bien>=6, Suficiente>=5 e
          Insuficiente <5). Filtrar errores.
        */

        var lista_notas= new Array();
        var total=0;
        var notaex=1;

        for (let i =0; i<6;i++){

            let nota=parseFloat(prompt("Introduce la nota que has sacado en el " + notaex + "º Examen: " ));

            lista_notas[i]=nota;

            total+=nota;
            notaex++;



        }
        let media=total/6;

        if (media>=9 && media<=10){
            document.write("¡Felicidades, has sacado un sobresaciente!, tu notas es " + media);
        }
        else if (media<9 && media>=7){
            document.write("Nada mal, has sacado un notable, tu nota es " + media);

            
        }
        else if(media<7 && media>=6){

            document.write("Has aprobado, pero esta nota se puede superar, tu nota es " + media);


        }
        else if(media<6 && media>=5){

            document.write("Por los pelos, hay que estudiar mas, tu nota es " + media);

        }

        else if (media<5 && media>=0){

            document.write("Fatal, has suspendido, a la próxima hay que estudiar mas, tu nota es " + media);

        }
        else{
            document.write("O tu media es por encima de 10 o por debajo de 0 en ambos casos imposible, por tanto vuelve a insertar las notas.");
        }



      
        
    </script>
</body>
